<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>YIQ Prototype ✅</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">

<style>
/* ============================================================
   YachtIQ tokens — generated from Figma (Yacht IQ — DS)
   Light mode only. Semantic tokens only. Never hardcode a hex.
   ============================================================ */
:root {
  /* Primitives — palette definition. Do not use in components. */
  --color-white:#ffffff; --color-black:#000000;
  --color-bluegray-25:#f8f9fb; --color-bluegray-50:#f1f5f9; --color-bluegray-100:#e2ebf3;
  --color-bluegray-200:#d3dce8; --color-bluegray-300:#b5c3d4; --color-bluegray-400:#9aa8bc;
  --color-bluegray-500:#7b8ba3; --color-bluegray-600:#64748b; --color-bluegray-700:#475569;
  --color-bluegray-800:#334155; --color-bluegray-900:#1e293b;
  --color-marine-blue-500:#2f92b6; --color-marine-blue-600:#277996;
  --color-bronze-100:#ece8e3; --color-bronze-300:#c9bdaf; --color-bronze-600:#88735e; --color-bronze-700:#756051;
  --color-orange-600:#db4d00; --color-orange-700:#ad4200;
  --color-red-600:#c71c22; --color-red-700:#af1218;
  --color-green-700:#1a8962; --color-green-800:#18684c;
  --color-purple-600:#7d3d8a;
  --color-alpha-gray-50:rgba(30,41,59,.5); --color-alpha-gray-10:rgba(30,41,59,.1);
  --color-alpha-bronze-5:rgba(117,96,81,.06); --color-alpha-bronze-12:rgba(117,96,81,.12);
  --color-alpha-green-15:rgba(50,195,143,.13); --color-alpha-red-7:rgba(232,41,47,.07);
  --color-alpha-blue-12:rgba(39,121,150,.12); --color-alpha-purple-9:rgba(125,61,138,.09);
  --color-alpha-orange-12:rgba(247,142,30,.12);

  /* Semantic — build with these */
  --color-text-default-primary:var(--color-bluegray-900);
  --color-text-default-secondary:var(--color-bluegray-800);
  --color-text-default-tertiary:var(--color-bluegray-700);
  --color-text-default-quaternary:var(--color-bluegray-600);
  --color-text-default-placeholder:var(--color-bluegray-500);
  --color-text-default-inverse:var(--color-white);
  --color-text-primary-default:var(--color-bronze-700);
  --color-text-success-default:var(--color-green-700);
  --color-text-error-default:var(--color-red-600);
  --color-text-info-default:var(--color-marine-blue-600);
  --color-text-ready-default:var(--color-purple-600);
  --color-icon-default-tertiary:var(--color-bluegray-700);
  --color-icon-default-quaternary:var(--color-bluegray-600);
  --color-icon-default-actions:var(--color-bluegray-400);
  --color-icon-primary-default:var(--color-bronze-700);
  --color-surface-default-default:var(--color-white);
  --color-surface-default-hover:var(--color-bluegray-25);
  --color-surface-default-base:var(--color-bluegray-50);
  --color-surface-default-base-hover:var(--color-bluegray-100);
  --color-surface-default-inverse:var(--color-bluegray-900);
  --color-surface-primary-default:var(--color-bronze-700);
  --color-surface-primary-subtle:var(--color-alpha-bronze-5);
  --color-surface-primary-subtle-hover:var(--color-alpha-bronze-12);
  --color-surface-success-subtle:var(--color-alpha-green-15);
  --color-surface-error-subtle:var(--color-alpha-red-7);
  --color-surface-info-subtle:var(--color-alpha-blue-12);
  --color-surface-ready-subtle:var(--color-alpha-purple-9);
  --color-surface-neutral-subtle:var(--color-alpha-gray-10);
  --color-border-default-primary:var(--color-bluegray-100);
  --color-border-default-secondary:var(--color-bluegray-200);
  --color-border-primary-default:var(--color-bronze-700);
  --color-border-primary-subtle:var(--color-alpha-bronze-12);
  --color-border-focus-ring:var(--color-bronze-700);

  /* Spacing (grid-8; 4·12·20 are component internals) */
  --spacing-2:2px; --spacing-4:4px; --spacing-6:6px; --spacing-8:8px; --spacing-12:12px; --spacing-16:16px; --spacing-20:20px;
  --spacing-24:24px; --spacing-32:32px; --spacing-40:40px; --spacing-48:48px;

  /* Radius */
  --radius-none:0px; --radius-xs:2px; --radius-sm:4px; --radius-md:8px; --radius-lg:12px;
  --radius-xl:16px; --radius-round:9999px;

  /* Typography */
  --font-family-sans:'DM Sans','DM Sans Fallback',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-size-10:10px; --font-size-12:12px; --font-size-14:14px; --font-size-16:16px;
  --font-size-20:20px; --font-size-24:24px; --font-size-28:28px; --font-size-32:32px; --font-size-36:36px;
  --line-height-14:14px; --line-height-16:16px; --line-height-20:20px; --line-height-24:24px;
  --line-height-28:28px; --line-height-32:32px; --line-height-36:36px; --line-height-40:40px;

  /* Layout */
  --layout-sidebar-expanded:216px; --layout-sidebar-rail:92px; --layout-topbar-height:76px;
  --layout-content-max:1152px; --layout-content-padding:32px;
  --layout-control-sm:32px; --layout-control-md:40px; --layout-control-lg:56px;
  --layout-table-header:40px; --layout-table-row:64px; --layout-touch-target:48px;
  --layout-icon-sm:16px; --layout-icon-md:20px; --layout-icon-lg:24px;

  /* Border & focus */
  --border-width-thin:1px; --border-width-thick:2px;
  --focus-ring-width:2px; --focus-ring-offset:2px;

  /* Elevation */
  --shadow-xs:0px 1px 2px rgba(30,41,59,.05);
  --shadow-sm:0px 1px 3px rgba(30,41,59,.08),0px 1px 2px rgba(30,41,59,.06);
  --shadow-md:0px 4px 6px -1px rgba(30,41,59,.08),0px 2px 4px -1px rgba(30,41,59,.04);
  --shadow-lg:0px 10px 15px -3px rgba(30,41,59,.1),0px 4px 6px -2px rgba(30,41,59,.05);

  /* Prototype shell state — one property drives everything anchored to the menu */
  --menu-w:var(--layout-sidebar-expanded);
}

/* ---------- Type scale — one class per Figma text style ---------- */
.heading-lg{font:600 var(--font-size-32)/var(--line-height-36) var(--font-family-sans)}
.heading-sm{font:600 var(--font-size-24)/var(--line-height-28) var(--font-family-sans)}
.heading-xs{font:600 var(--font-size-20)/var(--line-height-24) var(--font-family-sans)}
.heading-2xs{font:600 var(--font-size-16)/var(--line-height-24) var(--font-family-sans)}
.text-md-regular{font:400 var(--font-size-16)/var(--line-height-24) var(--font-family-sans)}
.text-md-medium{font:500 var(--font-size-16)/var(--line-height-24) var(--font-family-sans)}
.text-md-semibold{font:600 var(--font-size-16)/var(--line-height-24) var(--font-family-sans)}
.text-sm-regular{font:400 var(--font-size-14)/var(--line-height-20) var(--font-family-sans)}
.text-sm-medium{font:500 var(--font-size-14)/var(--line-height-20) var(--font-family-sans)}
.text-sm-semibold{font:600 var(--font-size-14)/var(--line-height-20) var(--font-family-sans)}
.text-xs-regular{font:400 var(--font-size-12)/var(--line-height-16) var(--font-family-sans)}
.text-xs-medium{font:500 var(--font-size-12)/var(--line-height-16) var(--font-family-sans)}
.overline-xs{font:600 var(--font-size-10)/var(--line-height-14) var(--font-family-sans);letter-spacing:.04em;text-transform:uppercase}

/* ---------- Reset & shell ---------- */
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--color-surface-default-base);
  color:var(--color-text-default-primary);
  font:400 var(--font-size-14)/var(--line-height-20) var(--font-family-sans);
  -webkit-font-smoothing:antialiased;
}
:focus-visible{
  outline:var(--focus-ring-width) solid var(--color-border-focus-ring);
  outline-offset:var(--focus-ring-offset);
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{display:block}
.icon-sm{width:var(--layout-icon-sm);height:var(--layout-icon-sm);flex:0 0 auto}
.icon-md{width:var(--layout-icon-md);height:var(--layout-icon-md);flex:0 0 auto}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

.app{
  display:grid;
  grid-template-columns:var(--menu-w) minmax(0,1fr);
  min-height:100vh;
}

/* ============================================================
   Menu/Expanded 216 + Menu/Collapsed 92 — two states, one shell
   ============================================================ */
.menu{
  grid-column:1;
  position:sticky; top:0; align-self:start;
  height:100vh;
  width:var(--menu-w);
  display:flex; flex-direction:column;
  background:var(--color-surface-default-default);
  border-right:var(--border-width-thin) solid var(--color-border-default-primary);
  overflow:hidden;
}
.menu__logo{
  height:var(--layout-topbar-height); flex:0 0 auto;
  display:flex; align-items:center;
  padding:var(--spacing-32) var(--spacing-16);
  border-bottom:var(--border-width-thin) solid var(--color-border-default-primary);
}
.menu__logo svg{height:18px;width:auto}
.menu__logo .mark{display:none;height:20px;width:auto}
.menu__nav{
  flex:1 1 auto; min-height:0; overflow-y:auto;
  display:flex; flex-direction:column; gap:var(--spacing-4);
  padding:var(--spacing-20) var(--spacing-16);
}
/* Nav Item — min-height 40, padding 8/12, gap 12, radius/md, icon 20 */
.nav-item{
  display:flex; align-items:center; gap:var(--spacing-12);
  min-height:var(--layout-control-md);
  padding:var(--spacing-8) var(--spacing-12);
  border-radius:var(--radius-md);
  border:var(--border-width-thin) solid transparent;
  background:var(--color-surface-default-default);
  color:var(--color-text-default-secondary);
  font:400 var(--font-size-16)/var(--line-height-24) var(--font-family-sans);
  text-align:left; width:100%;
  transition:background-color .12s ease,color .12s ease;
}
.nav-item__icon{color:var(--color-icon-default-tertiary);flex:0 0 auto}
.nav-item__label{flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
.nav-item:hover{background:var(--color-surface-default-hover)}
.nav-item[aria-current="page"]{
  background:var(--color-surface-primary-subtle);
  border-color:var(--color-border-primary-subtle);
  color:var(--color-text-primary-default);
  font-weight:500;
}
.nav-item[aria-current="page"] .nav-item__icon{color:var(--color-icon-primary-default)}
.menu__bottom{
  flex:0 0 auto;
  display:flex; align-items:center; justify-content:flex-end;
  padding:var(--spacing-24);
}
/* Icon Button 40×40 */
.icon-btn{
  width:var(--layout-control-md); height:var(--layout-control-md);
  display:flex; align-items:center; justify-content:center;
  background:var(--color-surface-default-default);
  border:var(--border-width-thin) solid var(--color-border-default-primary);
  border-radius:var(--radius-md);
  box-shadow:var(--shadow-md);
  color:var(--color-icon-default-tertiary);
}
.icon-btn:hover{background:var(--color-surface-default-hover)}
.menu__bottom .icon-btn::after{
  content:"";position:absolute;inset:-4px;
}
.menu__bottom .icon-btn{position:relative}

/* Collapsed rail */
.app[data-menu="collapsed"]{--menu-w:var(--layout-sidebar-rail)}
[data-menu="collapsed"] .menu__logo{justify-content:center;padding-inline:var(--spacing-16)}
[data-menu="collapsed"] .menu__logo .wordmark{display:none}
[data-menu="collapsed"] .menu__logo .mark{display:block}
[data-menu="collapsed"] .nav-item{justify-content:center;padding-inline:var(--spacing-12)}
[data-menu="collapsed"] .nav-item__label{display:none}
[data-menu="collapsed"] .menu__bottom{justify-content:center}

/* ============================================================
   Top Bar/Desktop 76px — Search = Hidden, plus the platform's
   Sales / Charter context strip. Navigation stays in the menu.
   ============================================================ */
.main{grid-column:2;display:flex;flex-direction:column;min-width:0}
.topbar{
  position:sticky; top:0; z-index:20;
  height:var(--layout-topbar-height); flex:0 0 auto;
  display:flex; align-items:center; justify-content:space-between; gap:var(--spacing-24);
  padding:0 var(--spacing-24);
  background:var(--color-surface-default-default);
  border-bottom:var(--border-width-thin) solid var(--color-border-default-primary);
}
/* Tabs / Tab — padding 16/12, no fill, no radius; Active = SemiBold + 2px bronze underline */
.tabs{display:flex;align-items:center;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  display:flex; align-items:center; justify-content:center;
  padding:var(--spacing-16) var(--spacing-12);
  border-bottom:var(--border-width-thick) solid transparent;
  color:var(--color-text-default-quaternary);
  font:400 var(--font-size-16)/var(--line-height-24) var(--font-family-sans);
  white-space:nowrap;
}
.tab:hover{color:var(--color-text-default-tertiary)}
.tab[aria-selected="true"]{
  color:var(--color-text-default-secondary);
  font-weight:600;
  border-bottom-color:var(--color-border-primary-default);
}
.topbar .tabs{align-self:stretch;margin-bottom:calc(var(--border-width-thin) * -1)}
.topbar .tab{padding-block:calc(var(--spacing-24) + var(--spacing-4))}

.usermenu{
  display:flex; align-items:center; gap:var(--spacing-8);
  height:var(--layout-control-sm);
  padding:0 var(--spacing-8);
  border-radius:var(--radius-md);
  color:var(--color-text-default-primary);
}
.usermenu:hover{background:var(--color-surface-default-hover)}
.avatar{
  width:var(--layout-control-sm); height:var(--layout-control-sm);
  border-radius:var(--radius-round);
  background:var(--color-surface-primary-default);
  color:var(--color-text-default-inverse);
  display:flex;align-items:center;justify-content:center;
  font:500 var(--font-size-14)/var(--line-height-20) var(--font-family-sans);
  flex:0 0 auto;
}
.usermenu__chev{color:var(--color-icon-default-tertiary)}

/* ---------- Content ---------- */
.content{
  flex:1 1 auto;
  padding:var(--spacing-24) var(--layout-content-padding) var(--spacing-48);
  display:flex; flex-direction:column; gap:var(--spacing-24);
}
.panel{
  background:var(--color-surface-default-default);
  border:var(--border-width-thin) solid var(--color-border-default-primary);
  border-radius:var(--radius-lg);
}
.panel--pad{padding:var(--spacing-24)}

.page-title{
  margin:0 0 var(--spacing-20);
  color:var(--color-text-default-secondary);
  font:600 var(--font-size-32)/var(--line-height-36) var(--font-family-sans);
  text-wrap:balance;
}

/* ---------- KPI strip ---------- */
.kpis{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:var(--spacing-16);
}
.kpi{
  display:flex; flex-direction:column; gap:var(--spacing-12);
  padding:var(--spacing-16) var(--spacing-20);
  border:var(--border-width-thin) solid var(--color-border-default-primary);
  border-radius:var(--radius-md);
  min-height:96px;
}
.kpi__label{
  display:flex; align-items:center; gap:var(--spacing-8);
  color:var(--color-text-default-tertiary);
}
.kpi__value{
  color:var(--color-text-default-primary);
  font:600 var(--font-size-32)/var(--line-height-36) var(--font-family-sans);
  font-variant-numeric:tabular-nums;
}
/* Brokerage / tenant card — brand, not a metric */
.kpi--brokerage{align-items:center;justify-content:center;text-align:center;gap:var(--spacing-8)}
/* Third-party brand mark — a supplied asset, so it carries its own
   colour rather than a semantic token. */
.kpi--brokerage .brokerage__logo{
  width:100%; max-width:212px; height:auto; display:block;
}

/* ---------- Table panel ---------- */
.tabstrip{
  display:flex; align-items:center;
  padding:0 var(--spacing-24);
  border-bottom:var(--border-width-thin) solid var(--color-border-default-primary);
}
.tabstrip .tab{margin-bottom:calc(var(--border-width-thick) * -1)}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:880px}
/* Header Cell — 40px, Text/xs/Medium, text/default/tertiary, 1px bottom edge */
th{
  height:var(--layout-table-header);
  padding:0 var(--spacing-24);
  text-align:left; white-space:nowrap;
  background:var(--color-surface-default-default);
  border-bottom:var(--border-width-thin) solid var(--color-border-default-primary);
  color:var(--color-text-default-tertiary);
  font:500 var(--font-size-12)/var(--line-height-16) var(--font-family-sans);
  letter-spacing:.04em; text-transform:uppercase;
}
th button{
  display:inline-flex;align-items:center;gap:var(--spacing-4);
  color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit;
  border-radius:var(--radius-sm);
}
th .sort{color:var(--color-icon-default-actions);transition:transform .12s ease,color .12s ease}
th[aria-sort] .sort{color:var(--color-icon-primary-default)}
th[aria-sort="ascending"] .sort{transform:rotate(180deg)}
/* Table Row — 64px; the row owns the height */
tbody tr{border-bottom:var(--border-width-thin) solid var(--color-border-default-primary)}
tbody tr:last-child{border-bottom:0}
tbody tr:hover{background:var(--color-surface-default-hover)}
td{
  height:var(--layout-table-row);
  padding:var(--spacing-8) var(--spacing-24);
  vertical-align:middle;
  color:var(--color-text-default-secondary);
  font:400 var(--font-size-14)/var(--line-height-20) var(--font-family-sans);
}
.cell-yacht{display:flex;align-items:center;gap:var(--spacing-12)}
/* Table Cell Type=Media — placeholder until real listing imagery is wired in */
.thumb{
  width:44px;height:32px;flex:0 0 auto;
  border-radius:var(--radius-sm);
  background:var(--color-surface-default-base-hover);
  border:var(--border-width-thin) solid var(--color-border-default-primary);
  display:flex;align-items:center;justify-content:center;
  color:var(--color-icon-default-actions);
}
.cell-yacht__name{
  color:var(--color-text-default-secondary);
  font:500 var(--font-size-14)/var(--line-height-20) var(--font-family-sans);
  text-transform:uppercase; letter-spacing:.02em;
}
.muted{color:var(--color-text-default-quaternary)}
.price{display:flex;flex-direction:column;gap:2px}
.price__value{color:var(--color-text-default-secondary);font-variant-numeric:tabular-nums}
/* Table Cell Type = Delta Up / Delta Down — the arrow carries direction, never colour alone */
.delta{display:flex;align-items:center;gap:var(--spacing-4);font:500 var(--font-size-12)/var(--line-height-16) var(--font-family-sans);font-variant-numeric:tabular-nums}
.delta--up{color:var(--color-text-success-default)}
.delta--down{color:var(--color-text-error-default)}
.nowrap{white-space:nowrap;font-variant-numeric:tabular-nums}

/* ---------- Pagination ---------- */
.pagination{
  display:flex;align-items:center;justify-content:space-between;gap:var(--spacing-16);
  padding:var(--spacing-16) var(--spacing-24);
  border-top:var(--border-width-thin) solid var(--color-border-default-primary);
}
.page-step{
  display:inline-flex;align-items:center;gap:var(--spacing-8);
  min-height:var(--layout-control-md);padding:0 var(--spacing-12);
  border-radius:var(--radius-md);
  color:var(--color-text-default-tertiary);
  font:500 var(--font-size-14)/var(--line-height-20) var(--font-family-sans);
}
.page-step:hover:not(:disabled){background:var(--color-surface-default-hover)}
.page-step:disabled{color:var(--color-text-default-placeholder);cursor:default}
.page-list{display:flex;align-items:center;gap:var(--spacing-4)}
/* Pagination Item */
.page-item{
  min-width:var(--layout-control-md);height:var(--layout-control-md);
  display:inline-flex;align-items:center;justify-content:center;
  padding:0 var(--spacing-8);
  border-radius:var(--radius-round);
  color:var(--color-text-default-tertiary);
  font:400 var(--font-size-14)/var(--line-height-20) var(--font-family-sans);
  font-variant-numeric:tabular-nums;
}
.page-item:hover{background:var(--color-surface-default-hover)}
.page-item[aria-current="page"]{
  background:var(--color-surface-primary-subtle);
  color:var(--color-text-primary-default);
  font-weight:500;
}
.page-ellipsis{
  min-width:var(--layout-control-md);height:var(--layout-control-md);
  display:inline-flex;align-items:center;justify-content:center;
  color:var(--color-text-default-quaternary);
}

/* ============================================================
   Top Bar search — Top Bar/Desktop, Search = Shown
   ============================================================ */
.topbar__search{display:none;align-items:center;gap:var(--spacing-8);flex:0 1 578px;min-width:0}
[data-search="shown"] .topbar__search{display:flex}
/* Input / Field, Type = Search */
.field{
  display:flex;align-items:center;gap:var(--spacing-8);
  height:var(--layout-control-md);flex:1 1 auto;min-width:0;
  padding:0 var(--spacing-16);
  background:var(--color-surface-default-default);
  border:var(--border-width-thin) solid var(--color-border-default-primary);
  border-radius:var(--radius-md);
}
.field:focus-within{border-color:var(--color-border-primary-default)}
.field__icon{color:var(--color-icon-default-actions)}
.field input{
  flex:1 1 auto;min-width:0;border:0;outline:0;background:none;
  font:400 var(--font-size-14)/var(--line-height-20) var(--font-family-sans);

}
.field input::placeholder{color:var(--color-text-default-placeholder)}
/* Search Button — icon-only 40×40 */
.sq-btn{

/* ============================================================
   Page Header / Yacht List Detail
   ============================================================ */
.pagehead{display:flex;flex-direction:column;gap:var(--spacing-16)}

.btn-ghost{

.results{display:flex;align-items:center;gap:var(--spacing-8)}
.results__count{

}

/* Button, Style=Solid Size=md */
.btn-solid{

  height:var(--layout-control-md);padding:var(--spacing-8) var(--spacing-16);

  font:600 var(--font-size-14)/var(--line-height-20) var(--font-family-sans);
}
.btn-solid:hover{background:var(--color-bronze-600)}

/* Checkbox — 18px box, radius/sm, 1.5px border/default/tertiary */
.checkbox{
  width:18px;height:18px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  background:var(--color-surface-default-default);

}
.checkbox[aria-checked="true"] svg{opacity:1}

/* ============================================================
   Yachts Card grid
   ============================================================ */
.cardgrid{
  display:grid;
  /* Desktop: as many 296px+ columns as fit, never more than 4 */
  grid-template-columns:repeat(auto-fill,minmax(max(296px, calc((100% - 3 * var(--spacing-24)) / 4)),1fr));
  gap:var(--spacing-24);
  align-items:start;
}
.ycard{
  display:flex;flex-direction:column;gap:var(--spacing-16);
  padding-bottom:var(--spacing-8);
  background:var(--color-surface-default-default);
  border-radius:var(--radius-lg);

  position:relative;
  transition:box-shadow .12s ease;
}
.ycard:hover{box-shadow:var(--shadow-md)}
.ycard__media{
  position:relative;
  height:184px;

}
.ycard__media img{width:100%;height:100%;object-fit:cover;display:block}
/* Media placeholder — a listing with no imagery yet */
.ycard__noimage{
  width:100%;height:100%;

}

.ycard__noimage p{margin:0;color:var(--color-text-default-quaternary);font:500 var(--font-size-12)/var(--line-height-16) var(--font-family-sans)}
/* Nav Dots — 6 dots, 6px, centred, 13px from the bottom */
.ycard__dots{
  position:absolute;left:50%;bottom:13px;transform:translateX(-50%);
  display:flex;gap:var(--spacing-4);
  padding:var(--spacing-4) var(--spacing-8);
  border-radius:var(--radius-round);
  background:var(--color-alpha-gray-50);
}
.ycard__dots i{

  background:var(--color-white);opacity:.5;display:block;
}
.ycard__dots i.is-on{opacity:1}
/* Overlay row — checkbox left, Sale/Charter tags right */
.ycard__overlay{
  position:absolute;top:11px;left:16px;right:16px;
  display:flex;align-items:center;justify-content:flex-end;gap:var(--spacing-8);
}
.ycard__overlay .checkbox{box-shadow:var(--shadow-sm)}
.ytag{box-shadow:var(--shadow-xs)}
.ycard__tags{display:flex;gap:var(--spacing-4)}
.ytag{
  padding:var(--spacing-4) var(--spacing-8);
  border-radius:var(--radius-sm);
  background:var(--color-surface-default-base-hover);
  color:var(--color-text-default-tertiary);
  font:500 var(--font-size-14)/var(--line-height-20) var(--font-family-sans);
}
.ycard__body{display:flex;flex-direction:column;gap:var(--spacing-4);padding:0 var(--spacing-16)}
.ycard__name{

  overflow-wrap:anywhere;
}
.ycard__group{
  display:flex;flex-direction:column;gap:var(--spacing-4);

}

.spec{display:flex;gap:var(--spacing-4);align-items:baseline;min-width:0}

}
.spec__val{
  min-width:0;
  color:var(--color-text-default-tertiary);
  font:500 var(--font-size-14)/var(--line-height-20) var(--font-family-sans);

}

/* ============================================================

   (Yachts Card geometry, with the show-specific rows the live
   platform adds: presence checks, berth and observations.)
   ============================================================ */
.showgrid{
  display:grid;

  grid-template-columns:repeat(auto-fill,minmax(296px,1fr));

}
.scard{

}

  position:absolute;top:var(--spacing-8);right:var(--spacing-8);

}
/* Over photography a subtle tag has no contrast, so the show tags

.stag{
  padding:var(--spacing-4) var(--spacing-8);
  border-radius:var(--radius-sm);
  background:var(--color-surface-default-default);
  color:var(--color-text-default-secondary);
  font:500 var(--font-size-12)/var(--line-height-16) var(--font-family-sans);
  box-shadow:var(--shadow-xs);
}
.scard__dots{
  position:absolute;left:50%;bottom:13px;transform:translateX(-50%);
  display:flex;gap:var(--spacing-4);
  padding:var(--spacing-4) var(--spacing-8);
  border-radius:var(--radius-round);
  background:var(--color-alpha-gray-50);
}
.scard__dots i{width:6px;height:6px;border-radius:var(--radius-round);background:var(--color-white);opacity:.5;display:block}
.scard__dots i.is-on{opacity:1}
.scard__body{display:flex;flex-direction:column;gap:var(--spacing-8);padding:0 var(--spacing-16)}
.scard__name{
  margin:0;
  color:var(--color-text-primary-default);

}
.scard__group{

.checkrow{display:flex;align-items:center;gap:var(--spacing-24);flex-wrap:wrap}
.checkrow__item{display:flex;align-items:center;gap:var(--spacing-8)}
.checkrow__label{color:var(--color-text-default-tertiary);font:400 var(--font-size-14)/var(--line-height-20) var(--font-family-sans)}
.berthrow{display:flex;align-items:center;gap:var(--spacing-8);min-height:var(--spacing-24)}

/* Icon-only edit control — 24px visual, padded to the 48px target */
.inline-edit{

}

.obs{
  display:inline-flex;align-items:center;gap:var(--spacing-8);
  min-height:var(--layout-control-sm);
  padding:var(--spacing-4) var(--spacing-8);margin-left:calc(var(--spacing-8) * -1);
  border-radius:var(--radius-md);
  color:var(--color-text-default-tertiary);
  font:400 var(--font-size-14)/var(--line-height-20) var(--font-family-sans);
}
.obs:hover{background:var(--color-surface-default-hover)}
.obs__icon{color:var(--color-icon-default-actions)}

/* Compact list view — the same roster as rows */
.showrows{display:flex;flex-direction:column}
.showrow{
  display:flex;align-items:center;gap:var(--spacing-16);flex-wrap:wrap;
  min-height:var(--layout-table-row);
  padding:var(--spacing-12) 0;

}

/* Floating action button — contacts for this show */
.fab{

.sq-btn[data-active="true"]{

}

/* ============================================================

.idxhead{display:flex;align-items:center;justify-content:space-between;gap:var(--spacing-16);flex-wrap:wrap}

.idxwrap{display:flex;flex-direction:column;gap:var(--spacing-16)}
.btn-text{

/* Checkbox on media — 24×24, only while selecting */
.ycard__overlay{justify-content:space-between}

.checkbox--lg{width:var(--layout-icon-lg);height:var(--layout-icon-lg)}

/* Picker modal — Modal base 589:682 */
.pmodal{

.shcard{

.rowcard__key{color:var(--color-text-default-quaternary)}

/* ---------- Mobile bottom tab bar (menu becomes this under 640px) ---------- */
.tabbar{display:none}

/* ============================================================
   Responsive — 640 / 1024 / 1440
   ============================================================ */
@media (max-width:1024px){
  .app{--menu-w:var(--layout-sidebar-rail)}
  .app[data-menu="expanded"]{--menu-w:var(--layout-sidebar-expanded)}
  .content{padding-inline:var(--spacing-24)}
  .topbar{padding-inline:var(--spacing-16)}
  /* Tablet: always 2 cards per row */
  .cardgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  .app{grid-template-columns:minmax(0,1fr);--menu-w:0px}
  .app[data-menu="expanded"]{--menu-w:0px}
  .menu{display:none}
  .main{grid-column:1}
  .content{
    padding:var(--spacing-16) var(--spacing-16);
    padding-bottom:calc(72px + var(--spacing-24));
    gap:var(--spacing-16);
  }
  .topbar{gap:var(--spacing-8);padding-inline:var(--spacing-16)}
  .topbar .tab{font-size:var(--font-size-14);padding-inline:var(--spacing-8)}
  .usermenu__name{display:none}
  .page-title{font-size:var(--font-size-24);line-height:var(--line-height-28)}
  .panel--pad{padding:var(--spacing-16)}
  .kpi__value{font-size:var(--font-size-28);line-height:var(--line-height-32)}
  .tabstrip{padding-inline:var(--spacing-16);overflow-x:auto}
  .table-wrap{display:none}
  .cardlist{display:flex}
  .topbar__search{flex:1 1 auto}
  .field input{font-size:var(--font-size-16)}
  .pagehead__title{font-size:var(--font-size-24);line-height:var(--line-height-28)}
  .pagehead__row{flex-direction:column;align-items:stretch;gap:var(--spacing-12)}
  .cardgrid{grid-template-columns:minmax(0,1fr);gap:var(--spacing-16)}
  .idx-mobile{display:grid}
  .idxhead{flex-direction:column;align-items:stretch;gap:var(--spacing-12)}
  .combo{flex:1 1 auto;width:auto}
  .idxhead .pagehead__actions{flex-wrap:wrap}
  .selbar__actions{width:100%}
  .selbar__actions > *{flex:1 1 0}
  .selbar__actions .btn-outline-primary{width:100%}
  .toast{bottom:calc(72px + var(--spacing-16))}
  .showgrid{grid-template-columns:minmax(0,1fr);gap:var(--spacing-16)}
  .fab{bottom:calc(72px + var(--spacing-16));right:var(--spacing-16)}
  .topbar__reset{display:none!important}
  .ycard__name{font-size:var(--font-size-20);line-height:var(--line-height-24)}
  .pagination{padding:var(--spacing-16);flex-wrap:wrap;justify-content:center}
  .page-list{order:-1;width:100%;justify-content:center}

  /* Nav Bar/Mobile — the menu becomes a bottom tab bar */
  .tabbar{
    display:flex; position:fixed; bottom:0; left:0; right:0; z-index:30;
    background:var(--color-surface-default-default);
    border-top:var(--border-width-thin) solid var(--color-border-default-primary);
    padding-bottom:env(safe-area-inset-bottom);
    overflow-x:auto; scrollbar-width:none;
  }
  .tabbar::-webkit-scrollbar{display:none}
  .tabbar__item{
    flex:1 0 auto; min-width:72px; min-height:var(--layout-touch-target);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    padding:var(--spacing-8) var(--spacing-4);
    color:var(--color-text-default-quaternary);
    font:600 var(--font-size-12)/var(--line-height-16) var(--font-family-sans);
  }
  .tabbar__item svg{color:var(--color-icon-default-quaternary)}
  .tabbar__item[aria-current="page"]{color:var(--color-text-primary-default)}
  .tabbar__item[aria-current="page"] svg{color:var(--color-icon-primary-default)}
  .tabbar__label{max-width:9ch;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
}

/* Outline buttons — contour only, no fill at rest (global). Hover keeps its tint as feedback. */
.btn-outline,.btn-outline-primary,.btn-destructive{background:transparent}
.btn-outline:hover{background:var(--color-surface-default-hover)}
.btn-outline-primary:hover:not(:disabled){background:var(--color-surface-primary-subtle)}
.btn-destructive:hover{background:var(--color-surface-error-subtle)}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}

function sceneSvg(key, seed){
  if (LISTING_PHOTOS[key]) return LISTING_PHOTOS[key];
  const s = SCENES[key];
  const W = 336, H = 184, hz = Math.round(H * 0.58);
  const sunX = 60 + ((seed * 47) % 220);
  const sunR = 16 + (seed % 3) * 5;
  const hullY = hz + 14 + (seed % 3) * 6;
  const hullW = 118 + (seed % 4) * 16;
  const hullX = 40 + ((seed * 29) % 140);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
<defs>
<linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.sky[0]}"/><stop offset="1" stop-color="${s.sky[1]}"/></linearGradient>
<linearGradient id="se" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.sea[0]}"/><stop offset="1" stop-color="${s.sea[1]}"/></linearGradient>
<radialGradient id="gl"><stop offset="0" stop-color="${s.sun}" stop-opacity=".95"/><stop offset="1" stop-color="${s.sun}" stop-opacity="0"/></radialGradient>
</defs>
<rect width="${W}" height="${hz}" fill="url(#sk)"/>
<circle cx="${sunX}" cy="${Math.round(hz * s.sunY)}" r="${sunR * 3}" fill="url(#gl)"/>
<circle cx="${sunX}" cy="${Math.round(hz * s.sunY)}" r="${sunR}" fill="${s.sun}" opacity=".9"/>
<path d="M0 ${hz - 12} Q ${W * 0.2} ${hz - 26} ${W * 0.42} ${hz - 14} T ${W} ${hz - 20} L ${W} ${hz} L 0 ${hz} Z" fill="${s.haze}" opacity=".55"/>
<rect y="${hz}" width="${W}" height="${H - hz}" fill="url(#se)"/>
<rect x="${sunX - 14}" y="${hz}" width="28" height="${H - hz}" fill="${s.sun}" opacity=".18"/>
<g opacity=".28" fill="${s.sun}">
<rect x="0"  y="${hz + 16}" width="${W}" height="1.5"/>
<rect x="24" y="${hz + 34}" width="${W - 60}" height="1.5"/>
<rect x="10" y="${hz + 54}" width="${W - 30}" height="1.5"/>
</g>
<g transform="translate(${hullX} ${hullY})">
<path d="M0 26 L${hullW} 26 L${hullW - 20} 40 L14 40 Z" fill="#f4f6f8"/>
<path d="M0 26 L${hullW} 26 L${hullW - 20} 40 L14 40 Z" fill="#000" opacity=".06"/>
<rect x="18" y="12" width="${hullW - 52}" height="14" rx="3" fill="#fbfcfd"/>
<rect x="34" y="2"  width="${hullW - 90}" height="11" rx="3" fill="#ffffff"/>
<g fill="#5b6b7a" opacity=".5">
<rect x="24" y="16" width="11" height="6" rx="1.5"/>
<rect x="40" y="16" width="11" height="6" rx="1.5"/>
<rect x="56" y="16" width="11" height="6" rx="1.5"/>
</g>
<rect x="${hullW - 62}" y="-6" width="2.5" height="9" fill="#ffffff" opacity=".85"/>
<ellipse cx="${hullW / 2}" cy="41" rx="${hullW / 2}" ry="3.5" fill="#000" opacity=".14"/>
</g>
</svg>`;
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}

const el = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function fmtDate(iso){
  const [y,m,d] = iso.split('-');
  return `${MONTHS[+m-1]} ${d}, ${y}`;
}
function priceToNumber(str){ return Number(String(str).replace(/\./g,'')); }
function fmtNumber(n){ return n.toLocaleString('de-DE'); }

function renderChrome(){
  el('logoWordmark').innerHTML = LOGO_WORDMARK;
  el('logoMark').innerHTML = LOGO_MARK;
  el('userChev').innerHTML = ICON.chevronDown;
  el('searchIcon').innerHTML = ICON.search;
  el('filterIcon').innerHTML = ICON.filterLines;

      <span class="nav-item__icon icon-md">${ICON[n.icon]}</span>
      <span class="nav-item__label">${esc(n.label)}</span>

function syncToggle(){
  const collapsed = el('app').dataset.menu === 'collapsed';
  el('menuToggleIcon').innerHTML = collapsed ? ICON.chevronRight : ICON.chevronLeft;
  el('menuToggle').setAttribute('aria-expanded', String(!collapsed));
  el('menuToggleLabel').textContent = collapsed ? 'Expand menu' : 'Collapse menu';
}

/* ============================================================
   Render — Dashboard (Sales Summary)
   ============================================================ */
function activeRows(){
  const tab = TABLE_TABS.find(t => t.id === state.tab);
  let rows = tab.rows.slice();
  const { key, dir } = state.sort;
  if (key) {
    const col = COLUMNS.find(c => c.key === key);
    rows.sort((a,b) => {
      let av = a[col.idx], bv = b[col.idx];
      if (key === 'price'){ av = priceToNumber(av); bv = priceToNumber(bv); }
      else if (key === 'updated'){ av = a[6]; bv = b[6]; }
      else { av = (av ?? '').toString().toLowerCase(); bv = (bv ?? '').toString().toLowerCase(); }
      if (av < bv) return dir === 'asc' ? -1 : 1;
      if (av > bv) return dir === 'asc' ? 1 : -1;
      return 0;
    });
  }
  return rows;
}

function deltaHtml(pct){
  if (pct === null || pct === undefined) return '';
  const up = pct > 0;
  const sign = up ? '+' : '';
  return `<span class="delta ${up ? 'delta--up' : 'delta--down'}">
      <span class="icon-sm" style="width:12px;height:12px">${up ? ICON.arrowUp : ICON.arrowDown}</span>
      ${sign}${pct}%
    </span>`;
}

function renderDashboard(){
  const s = SUMMARY[state.line];
  const lineLabel = state.line === 'sales' ? 'Sales' : 'Charter';
  const rows = activeRows();
  const pages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
  if (state.page > pages) state.page = pages;
  const slice = rows.slice((state.page-1)*PAGE_SIZE, state.page*PAGE_SIZE);

  return `

function paginationItems(current, total){
  const out = [];
  const add = p => out.push(
    `<button class="page-item" type="button" data-page="${p}" ${p === current ? 'aria-current="page"' : ''}>${p}</button>`);
  const gap = () => out.push('<span class="page-ellipsis" aria-hidden="true">…</span>');
  if (total <= 7){ for (let p = 1; p <= total; p++) add(p); return out.join(''); }
  add(1);
  if (current > 4) gap();
  for (let p = Math.max(2, current-1); p <= Math.min(total-1, current+1); p++) add(p);
  if (current < total-3) gap();
  add(total);
  return out.join('');
}

/* Sort options — exactly the Dropdown Menu in Figma (695:26896).

const FX = { '€':1, '$':0.92, '£':1.17 };
const priceEur = y => Number(y.price.replace(/[^0-9]/g,'')) * (FX[y.price[0]] || 1);
const loaM = y => parseFloat((y.loa.match(/([\d.]+)\s*m$/) || [0,0])[1]);

  { id:'relevance',  label:'Relevance' },
  { id:'market',     label:'Time on Market',     cmp:(a,b) => a.listedDays - b.listedDays },
  { id:'price-desc', label:'Price: High to low', cmp:(a,b) => priceEur(b) - priceEur(a) },
  { id:'price-asc',  label:'Price: Low to high', cmp:(a,b) => priceEur(a) - priceEur(b) },
  { id:'loa-desc',   label:'LOA: High to low',   cmp:(a,b) => loaM(b) - loaM(a) },
  { id:'loa-asc',    label:'LOA: Low to high',   cmp:(a,b) => loaM(a) - loaM(b) }
];

/* ============================================================
   Add To List / Add To Show — Modal base (Figma 589:682):
   64px top with title + x-close, content rows at 24px,
   bottom with two equal CTAs. Search field + CREATE row +
   a scrolling checklist of the saved lists or shows.
   ============================================================ */
const PICKER = {
  list:{ title:'Add To List', placeholder:'Search or create a list', createLabel:'New Yacht List', items:SAVED_LISTS, noun:['list','lists'] },
  show:{ title:'Add To Show', placeholder:'Search the show',         createLabel:'New Yacht Show', items:SAVED_SHOWS, noun:['show','shows'] }
};

function openPickerModal(kind){
  const cfg = PICKER[kind];
  const picked = new Set();
  const opener = document.activeElement;
  const wrap = document.createElement('div');
  wrap.className = 'scrim';
  wrap.innerHTML = `
    <div class="pmodal" role="dialog" aria-modal="true" aria-labelledby="pmTitle">
      <div class="pmodal__top">
        <h2 class="heading-sm" id="pmTitle">${cfg.title}</h2>
        <button class="pmodal__x" type="button" data-pm-close aria-label="Close">${ICON.close}</button>
      </div>
      <div class="pmodal__body">
        <div class="searchgroup">
          <label class="sr-only" for="pmSearch">${cfg.placeholder}</label>
          <input id="pmSearch" type="text" autocomplete="off" placeholder="${cfg.placeholder}">
          <span class="searchgroup__btn" aria-hidden="true"><span class="icon-md">${ICON.search}</span></span>
        </div>
        <button class="pmodal__create" type="button" data-pm-create>
          <span class="icon-md">${ICON.plus}</span>
          <span class="pmodal__create-key">Create:</span>
          <span class="pmodal__create-val">${cfg.createLabel}</span>
        </button>
        <div class="pmodal__list" role="group" aria-label="${cfg.noun[1]}"></div>
      </div>
      <div class="pmodal__bottom">
        <button class="btn-outline" type="button" data-pm-close>Close</button>
        <button class="btn-solid" type="button" data-pm-save disabled>Save Changes</button>
      </div>
    </div>`;
  document.body.appendChild(wrap);
  const $ = sel => wrap.querySelector(sel);
  const input = $('#pmSearch'), listEl = $('.pmodal__list'), save = $('[data-pm-save]'), createVal = $('.pmodal__create-val');

  const draw = () => {
    const q = input.value.trim().toLowerCase();
    const rows = cfg.items.filter(it => !q || it.toLowerCase().includes(q));
    listEl.innerHTML = rows.length ? rows.map(it => `
      <label class="pmodal__row">
        <button class="checkbox" type="button" role="checkbox" data-pm-item="${esc(it)}" aria-checked="${picked.has(it)}">${ICON.check}</button>
        <span>${esc(it)}</span>
      </label>`).join('')
      : `<p class="pmodal__empty">No ${cfg.noun[1]} match “${esc(input.value.trim())}”.</p>`;
    createVal.textContent = input.value.trim() || cfg.createLabel;
    save.disabled = picked.size === 0;
  };
  const close = () => { wrap.remove(); opener?.focus?.(); };

  input.addEventListener('input', draw);
  wrap.addEventListener('click', ev => {
    if (ev.target === wrap || ev.target.closest('[data-pm-close]')) return close();
    const item = ev.target.closest('[data-pm-item]') ||
      (ev.target.closest('.pmodal__row') && ev.target.closest('.pmodal__row').querySelector('[data-pm-item]'));
    if (item){
      ev.preventDefault();
      const v = item.dataset.pmItem;
      picked.has(v) ? picked.delete(v) : picked.add(v);
      draw(); wrap.querySelector(`[data-pm-item="${CSS.escape(v)}"]`)?.focus(); return;
    }
    if (ev.target.closest('[data-pm-create]')){
      const name = input.value.trim();
      if (!name){ input.focus(); return; }
      if (!cfg.items.includes(name)) cfg.items.unshift(name);
      picked.add(name); input.value = ''; draw(); return;
    }
    if (ev.target.closest('[data-pm-save]') && picked.size){
      const n = state.idx.selected.size, k = picked.size;
      const where = k === 1 ? [...picked][0] : `${k} ${cfg.noun[1]}`;
      wrap.remove();
      state.idx.selecting = false; state.idx.selected.clear();
      render(); toast(`${n} yacht${n === 1 ? '' : 's'} added to ${where}`);
    }
  });
  wrap.addEventListener('keydown', ev => {
    if (ev.key === 'Escape') close();
    if (ev.key === 'Enter' && ev.target === input && input.value.trim()) $('[data-pm-create]').click();
    if (ev.key === 'Tab'){ /* keep focus inside the dialog */
      const f = [...wrap.querySelectorAll('button:not(:disabled), input')];
      if (ev.shiftKey && document.activeElement === f[0]){ ev.preventDefault(); f[f.length-1].focus(); }
      else if (!ev.shiftKey && document.activeElement === f[f.length-1]){ ev.preventDefault(); f[0].focus(); }
    }
  });
  draw(); input.focus();
}

function toast(msg){
  document.querySelector('.toast')?.remove();
  const t = document.createElement('div');
  t.className = 'toast'; t.setAttribute('role','status'); t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}

/* ---- Yacht Matches modals ---- */
function mtModal(html){
  const wrap = document.createElement('div');
  wrap.className = 'scrim'; wrap.innerHTML = html;
  document.body.appendChild(wrap);
  const opener = document.activeElement;
  const close = () => { wrap.remove(); opener?.focus?.(); };
  wrap.addEventListener('keydown', ev => { if (ev.key === 'Escape') close(); });
  wrap.addEventListener('click', ev => { if (ev.target === wrap || ev.target.closest('[data-mt-close]')) close(); });
  return { wrap, close };
}
function removeMatch(m){
  const i = MATCHES.indexOf(m); if (i > -1) MATCHES.splice(i, 1);
  state.matches.open.delete(m.id); MATCH_TOTAL.count--;
}

function openCreateYacht(m){
  const { wrap, close } = mtModal(`
    <div class="modal mt-modal" role="dialog" aria-modal="true" aria-labelledby="cyTitle">
      <h2 class="heading-sm mt-modal__title" id="cyTitle">Create New Yacht</h2>
      <div class="mt-form">
        <div class="mt-f mt-f--full"><label class="mt-label" for="cyName">Yacht Name<span class="req">*</span></label>

          <span class="mt-err" id="cyNameErr" hidden>Yacht name is required.</span></div>
        <div class="mt-f"><label class="mt-label" for="cyBid">Builder ID</label><input class="mt-input" id="cyBid" type="text" autocomplete="off"></div>
        <div class="mt-f"><label class="mt-label" for="cyYear">Builder Year</label><input class="mt-input" id="cyYear" type="text" inputmode="numeric" autocomplete="off"></div>
        <div class="mt-f"><label class="mt-label" for="cyFt">LOA (feet)<span class="req">*</span></label>
          <input class="mt-input" id="cyFt" type="text" autocomplete="off" aria-required="true" aria-describedby="cyFtErr">
          <span class="mt-err" id="cyFtErr" hidden>LOA in feet is required.</span></div>
        <div class="mt-f"><label class="mt-label" for="cyM">LOA (meters)<span class="req">*</span></label>
          <input class="mt-input" id="cyM" type="text" autocomplete="off" aria-required="true" aria-describedby="cyMErr">
          <span class="mt-err" id="cyMErr" hidden>LOA in meters is required.</span></div>
      </div>
      <div class="mt-modal__actions">
        <button class="btn-outline" type="button" data-mt-close>Discard</button>
        <button class="btn-solid" type="button" data-cy-ok>Create</button>
      </div>
    </div>`);
  const $ = q => wrap.querySelector(q);
  const req = [['#cyName','#cyNameErr'],['#cyFt','#cyFtErr'],['#cyM','#cyMErr']];
  req.forEach(([f,e]) => $(f).addEventListener('input', () => { if ($(f).value.trim()){ $(f).classList.remove('is-error'); $(f).removeAttribute('aria-invalid'); $(e).hidden = true; } }));
  $('[data-cy-ok]').addEventListener('click', () => {
    let first = null;
    req.forEach(([f,e]) => { const bad = !$(f).value.trim(); $(f).classList.toggle('is-error', bad); bad ? $(f).setAttribute('aria-invalid','true') : $(f).removeAttribute('aria-invalid'); $(e).hidden = !bad; if (bad && !first) first = $(f); });
    if (first){ first.focus(); return; }
    const name = $('#cyName').value.trim();
    close(); if (m) removeMatch(m); render(); toast(`${name} created${m ? ` from ${m.name}` : ''}`);
  });
  $('#cyName').focus();
}

function openMergeYacht(m){
  let picked = null;
  const { wrap, close } = mtModal(`
    <div class="modal mt-modal" role="dialog" aria-modal="true" aria-labelledby="myTitle">
      <h2 class="heading-sm mt-modal__title" id="myTitle">Establish Yacht Match</h2>
      <div class="mt-f mt-f--full">
        <label class="mt-label" for="mySearch">Search Yacht</label>
        <div class="mt-search"><input class="mt-input" id="mySearch" type="text" autocomplete="off" placeholder="Search by yacht name"
          role="combobox" aria-expanded="false" aria-controls="myResults" aria-autocomplete="list">
          <span class="icon-md mt-search__icon">${ICON.search}</span></div>
        <div class="mt-results" id="myResults" role="listbox" aria-label="Matching yachts" hidden></div>
      </div>
      <div class="mt-modal__actions">
        <button class="btn-outline" type="button" data-mt-close>Discard</button>
        <button class="btn-solid" type="button" data-my-ok disabled>Apply</button>
      </div>
    </div>`);
  const input = wrap.querySelector('#mySearch'), box = wrap.querySelector('#myResults'), ok = wrap.querySelector('[data-my-ok]');
  const draw = () => {
    const q = input.value.trim().toLowerCase();
    const rows = MERGE_CATALOG.filter(y => !q || y.name.toLowerCase().includes(q) || y.builder.toLowerCase().includes(q)).slice(0, 6);
    box.hidden = false; input.setAttribute('aria-expanded','true');
    box.innerHTML = rows.length ? rows.map(y => `
      <button class="mt-result" type="button" role="option" aria-selected="${picked === y.name}" data-my-pick="${esc(y.name)}">
        <span class="mt-result__name">${esc(y.name)}</span>
        <span class="mt-result__meta">Builder: ${esc(y.builder)} • LOA: ${esc(y.loa)} • Year: ${esc(y.year)}</span>
      </button>`).join('') : `<p class="mt-result__empty">No yachts match “${esc(input.value.trim())}”.</p>`;
  };
  input.addEventListener('focus', draw);
  input.addEventListener('input', () => { picked = null; ok.disabled = true; draw(); });
  wrap.addEventListener('click', ev => {
    const pick = ev.target.closest('[data-my-pick]');
    if (pick){ picked = pick.dataset.myPick; input.value = picked; ok.disabled = false; draw(); return; }
    if (ev.target.closest('[data-my-ok]') && picked){ close(); removeMatch(m); render(); toast(`${m.name} merged into ${picked}`); }
  });
  input.focus();
}

function openIgnoreMatch(m){

        <button class="btn-solid" type="button" data-im-ok>Ignore Match</button>

  wrap.querySelector('[data-im-ok]').addEventListener('click', () => { close(); removeMatch(m); render(); toast(`${m.name} ignored`); });

}

document.addEventListener('click', e => {
  /* ---- Yacht Matches ---- */
  const mtT = e.target.closest('[data-mt-toggle]');
  if (mtT){ const id = +mtT.dataset.mtToggle; state.matches.open.has(id) ? state.matches.open.delete(id) : state.matches.open.add(id); state.matches.menu = null; render(); return; }
  const mtM = e.target.closest('[data-mt-menu]');
  if (mtM){ const id = +mtM.dataset.mtMenu; state.matches.menu = state.matches.menu === id ? null : id; render(); return; }
  const mtA = e.target.closest('[data-mt-act]');
  if (mtA){
    const m = MATCHES.find(x => x.id === +mtA.dataset.id); state.matches.menu = null; render();
    ({ create:openCreateYacht, merge:openMergeYacht, ignore:openIgnoreMatch })[mtA.dataset.mtAct](m); return;
  }
  if (e.target.closest('[data-mt-create-top]')){ openCreateYacht(null); return; }
  if (state.matches.menu !== null && !e.target.closest('.mt-menu')){ state.matches.menu = null; render(); }
  /* Card Yacht Show — the card opens the show; its inline controls do not */
  if (e.target.closest('[data-select-all-show]')){
    const vis = state.screen === 'yacht-list' ? listYachtsVisible() : showRosterVisible();
    const allOn = vis.length > 0 && vis.every(y => state.idx.selected.has(y.name));
    vis.forEach(y => allOn ? state.idx.selected.delete(y.name) : state.idx.selected.add(y.name));
    render(); return;
  }
  const remL = e.target.closest('[data-remove-from-list]');
  if (remL && !remL.disabled){
    const k = state.idx.selected.size;
    YACHT_LIST.yachts = YACHT_LIST.yachts.filter(y => !state.idx.selected.has(y.name));
    state.idx.selected.clear(); state.idx.selecting = false; render();
    toast(`${k} yacht${k === 1 ? '' : 's'} removed from ${YACHT_LIST.name}`); return;
  }
  if (e.target.closest('[data-yl-vis]')){ state.ylist.visOpen = !state.ylist.visOpen; state.ylist.moreOpen = false; render(); return; }
  const ylv = e.target.closest('[data-yl-visopt]');
  if (ylv){ YACHT_LIST.visibility = ylv.dataset.ylVisopt; state.ylist.visOpen = false; render(); toast(`${YACHT_LIST.name} is now ${YACHT_LIST.visibility}`); return; }
  if (e.target.closest('[data-yl-more]')){ state.ylist.moreOpen = !state.ylist.moreOpen; state.ylist.visOpen = false; render(); return; }
  const ylm = e.target.closest('[data-yl-moreopt]');
  if (ylm){
    state.ylist.moreOpen = false;
    const act = ylm.dataset.ylMoreopt;
    if (act === 'delete') confirmDeleteList();
    else { render(); toast(`${act === 'pdf' ? 'Downloading PDF of' : act === 'email' ? 'Sending email with' : 'Share link copied for'} ${YACHT_LIST.name}`); }
    return;
  }
  if (state.ylist.visOpen || state.ylist.moreOpen){ state.ylist.visOpen = false; state.ylist.moreOpen = false; render(); }
  const rem = e.target.closest('[data-remove-from-show]');
  if (rem && !rem.disabled){
    const names = [...state.idx.selected];
    for (let i = SHOW_ROSTER.length - 1; i >= 0; i--) if (state.idx.selected.has(SHOW_ROSTER[i].name)) SHOW_ROSTER.splice(i, 1);
    state.idx.selected.clear(); state.idx.selecting = false; render();
    toast(`${names.length} yacht${names.length === 1 ? '' : 's'} removed from ${YACHT_SHOW.name}`); return;
  }
  /* ---- Lists & Shows ---- */
  if (e.target.closest('[data-ls-create]')){ openCreateShared(); return; }
  const lsMenu = e.target.closest('[data-ls-menu]');
  if (lsMenu){ const id = +lsMenu.dataset.lsMenu; state.shared.menu = state.shared.menu === id ? null : id; render(); return; }
  const lsAct = e.target.closest('[data-ls-act]');
  if (lsAct){
    const r = SHARED.find(x => x.id === +lsAct.dataset.id), act = lsAct.dataset.lsAct;
    state.shared.menu = null;
    if (act === 'archive'){ SHARED.splice(SHARED.indexOf(r), 1); toast(`${r.name} archived`); }
    else if (act === 'revoke'){ r.revoked = true; toast(`Access revoked for ${r.client}`); }
    else if (act === 'restore'){ r.revoked = false; toast(`Access restored for ${r.client}`); }
    else toast(`Opening ${r.name} in ${act === 'broker' ? 'Broker' : 'Client'} View`);
    render(); return;
  }
  /* ---- Shared list detail ---- */
  const lsOpen = e.target.closest('[data-ls-open]');
  if (lsOpen){
    const r = SHARED.find(x => x.id === +lsOpen.dataset.lsOpen);
    /* Every Lists & Shows row opens the Yacht List view (Figma 695:28555) with its own name */
    YACHT_LIST.name = r.name; state.ylist.from = 'lists-shows';
    Object.assign(state.ylist, { visOpen:false, moreOpen:false });
    Object.assign(state.idx, { sortOpen:false, view:'grid', sort:'relevance', selecting:false, listOpen:false });
    state.idx.selected.clear(); state.shared.menu = null;
    state.screen = 'yacht-list'; state.query = ''; el('yachtSearch').value = '';
    render(); window.scrollTo(0,0); return;
  }
  if (e.target.closest('[data-sl-vis]')){ state.slist.visOpen = !state.slist.visOpen; state.slist.shareOpen = false; state.idx.sortOpen = false; render(); return; }
  const vopt = e.target.closest('[data-sl-visopt]');
  if (vopt){ state.slist.visibility = vopt.dataset.slVisopt; state.slist.visOpen = false; render(); toast(`List is now ${state.slist.visibility}`); return; }
  if (e.target.closest('[data-sl-share]')){ state.slist.shareOpen = !state.slist.shareOpen; state.slist.visOpen = false; state.idx.sortOpen = false; render(); return; }
  const shopt = e.target.closest('[data-sl-shareopt]');
  if (shopt){ state.slist.shareOpen = false; render(); toast(`${shopt.dataset.slShareopt} — ${state.slist.name}`); return; }
  if (state.slist.visOpen || state.slist.shareOpen){ state.slist.visOpen = false; state.slist.shareOpen = false; render(); }

  if (state.shared.menu !== null && !e.target.closest('.ls-menu')){ state.shared.menu = null; render(); }
  if (e.target.closest('[data-ls-sort]')){ state.shared.dir = state.shared.dir === 'desc' ? 'asc' : 'desc'; render(); return; }
  const lsPage = e.target.closest('[data-ls-page]');
  if (lsPage && !lsPage.disabled){
    const v = lsPage.dataset.lsPage, total = Math.max(1, Math.ceil(sharedRows().length / SHARED_PAGE));
    state.shared.page = v === 'prev' ? Math.max(1, state.shared.page - 1) : v === 'next' ? Math.min(total, state.shared.page + 1) : +v;
    render(); return;
  }
  if (e.target.closest('[data-share-show]')){ toast(`Share link for ${YACHT_SHOW.name} copied`); return; }
  const del = e.target.closest('[data-show-delete]');
  if (del){ confirmDeleteShow(del.dataset.showDelete); return; }
  if (e.target.closest('[data-show-edit],[data-show-notes],[data-show-map]')) return;
  const openShow = e.target.closest('[data-open-show]');
  if (openShow){
    YACHT_SHOW.name = openShow.dataset.openShow;
    state.idx.selecting = false; state.idx.selected.clear(); state.idx.sortOpen = false;
    state.screen = 'yacht-show-detail'; state.query = ''; el('yachtSearch').value = '';
    render(); window.scrollTo(0,0); return;
  }
  const nav = e.target.closest('[data-screen]');
  if (nav){
    state.screen = nav.dataset.screen;
    state.page = 1;
    state.query = '';
    el('yachtSearch').value = '';
    state.show.editingBerth = null;
    state.idx.sortOpen = false; state.idx.listOpen = false;
    state.idx.selecting = false; state.idx.selected.clear(); state.idx.addMenu = null;
    render(); return;
  }

  const line = e.target.closest('[data-line]');
  if (line){
    state.line = line.dataset.line;
    el('lineTabs').querySelectorAll('.tab').forEach(t =>
      t.setAttribute('aria-selected', String(t.dataset.line === state.line)));
    state.page = 1; render(); return;
  }

  const tab = e.target.closest('[data-tab]');
  if (tab){ state.tab = tab.dataset.tab; state.page = 1; render(); return; }

  const sort = e.target.closest('[data-sort]');
  if (sort){
    const key = sort.dataset.sort;
    if (state.sort.key === key) state.sort.dir = state.sort.dir === 'asc' ? 'desc' : 'asc';
    else state.sort = { key, dir:'asc' };
    render(); return;
  }

  const pick = e.target.closest('[data-select]');
  if (pick){
    const name = pick.dataset.select;
    if (state.selected.has(name)) state.selected.delete(name); else state.selected.add(name);
    render(); return;
  }

  const pickAll = e.target.closest('[data-select-all]');
  if (pickAll){
    const list = visibleYachts();
    const allOn = list.length > 0 && list.every(y => state.selected.has(y.name));
    if (allOn) list.forEach(y => state.selected.delete(y.name));
    else list.forEach(y => state.selected.add(y.name));
    render(); return;
  }

  const lsort = e.target.closest('[data-listsort]');
  if (lsort){
    state.listSort = state.listSort === 'default' ? 'az' : state.listSort === 'az' ? 'za' : 'default';
    render(); return;
  }

  /* ---- All Yachts index ---- */
  const ipick = e.target.closest('[data-idx-select]');
  if (ipick){
    const set = state.idx.selected, name = ipick.dataset.idxSelect;
    if (set.has(name)) set.delete(name); else set.add(name);
    render(); return;
  }
  if (e.target.closest('[data-idx-selecting]')){
    state.idx.selecting = !state.idx.selecting;
    state.idx.selected.clear(); state.idx.addMenu = null;
    render(); return;
  }
  if (e.target.closest('[data-clear-selection]')){ state.idx.selected.clear(); state.idx.addMenu = null; render(); return; }
  const addm = e.target.closest('[data-add-modal]');
  if (addm && !addm.disabled){ openPickerModal(addm.dataset.addModal); return; }
  const lopt = e.target.closest('[data-list-opt]');
  if (lopt){
    state.idx.listOpen = false;
    if (lopt.dataset.listOpt){
      YACHT_LIST.name = lopt.dataset.listOpt;
      if (state.screen === 'all-yachts') state.ylist.from = 'all-yachts';
      state.screen = 'yacht-list'; state.query = ''; el('yachtSearch').value = '';
      state.idx.selecting = false; state.idx.selected.clear();
    } else if (state.screen !== 'all-yachts'){
      state.screen = 'all-yachts'; state.query = ''; el('yachtSearch').value = '';
      state.idx.selecting = false; state.idx.selected.clear();
    }
    render(); return;
  }
  if (e.target.closest('[data-new-list]')){ state.idx.listOpen = false; render(); openNewListModal(); return; }
  if (e.target.closest('.combo')){
    if (!state.idx.listOpen){ state.idx.listOpen = true; state.idx.sortOpen = false; render(); el('idxListInput').focus(); }
    return;
  }
  if (state.idx.listOpen){ state.idx.listOpen = false; render(); }
  if (e.target.closest('[data-idx-sort]')){
    state.idx.sortOpen = !state.idx.sortOpen;
    render();
    if (state.idx.sortOpen) (document.querySelector('.menu-item[aria-checked="true"]') || {}).focus?.();
    return;
  }
  const sopt = e.target.closest('[data-idx-sortopt]');
  if (sopt){
    state.idx.sort = sopt.dataset.idxSortopt; state.idx.sortOpen = false;
    render(); el('idxSortBtn')?.focus(); return;
  }
  if (state.idx.sortOpen && !e.target.closest('#idxSortMenu')){
    state.idx.sortOpen = false; render();
  }
  if (e.target.closest('[data-idx-view]')){
    state.idx.view = state.idx.view === 'grid' ? 'list' : 'grid';
    render(); return;
  }

  /* ---- Yacht Show ---- */
  const scheck = e.target.closest('[data-showcheck]');
  if (scheck){
    const set = state.show[scheck.dataset.showcheck];
    const name = scheck.dataset.yacht;
    if (set.has(name)) set.delete(name); else set.add(name);
    render(); return;
  }

  const berth = e.target.closest('[data-berth]');
  if (berth){ state.show.editingBerth = berth.dataset.berth; render(); return; }

  const sview = e.target.closest('[data-showview]');
  if (sview){
    state.show.view = state.show.view === 'grid' ? 'list' : 'grid';
    render(); return;
  }

  const page = e.target.closest('[data-page]');
  if (page && !page.disabled){
    const v = page.dataset.page;
    const total = Math.max(1, Math.ceil(activeRows().length / PAGE_SIZE));
    if (v === 'prev') state.page = Math.max(1, state.page - 1);
    else if (v === 'next') state.page = Math.min(total, state.page + 1);
    else state.page = Number(v);
    render();
  }
});

/* List chooser — typing filters the saved lists in place (no re-render,
   so the field keeps focus); arrows move, Enter picks, Escape closes. */
function filterLists(q){
  const opts = [...document.querySelectorAll('#idxListBox .combo__opt')];
  let shown = 0;
  opts.forEach(o => { const on = !q || o.dataset.label.includes(q); o.hidden = !on; if (on) shown++; o.classList.remove('is-active'); });
  const empty = document.querySelector('#idxListBox .combo__empty');
  if (empty) empty.hidden = shown > 0;
}
document.addEventListener('input', e => {
  if (!e.target.matches('[data-list-input]')) return;
  if (!state.idx.listOpen){ state.idx.listOpen = true; e.target.closest('.combo').dataset.open = 'true';
    el('idxListMenu').hidden = false; e.target.setAttribute('aria-expanded','true'); }
  filterLists(e.target.value.trim().toLowerCase());
});
document.addEventListener('keydown', e => {
  if (!e.target.matches('[data-list-input]')) return;
  const opts = [...document.querySelectorAll('#idxListBox .combo__opt:not([hidden])')];
  const i = opts.findIndex(o => o.classList.contains('is-active'));
  if (e.key === 'Escape'){ state.idx.listOpen = false; render(); el('idxListInput').focus(); return; }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    e.preventDefault();
    if (!state.idx.listOpen){ state.idx.listOpen = true; render(); el('idxListInput').focus(); return; }
    if (!opts.length) return;
    const n = (i + (e.key === 'ArrowDown' ? 1 : opts.length - 1) + (i < 0 && e.key === 'ArrowUp' ? 1 : 0)) % opts.length;
    opts.forEach(o => o.classList.remove('is-active'));
    opts[n].classList.add('is-active'); opts[n].scrollIntoView({block:'nearest'});
    e.target.setAttribute('aria-activedescendant','');
  }
  if (e.key === 'Enter' && i >= 0){ e.preventDefault(); opts[i].click(); }
});

/* New Yacht List — Modal. Creates the list and adds it to the dropdown. */
function openNewListModal(){
  const wrap = document.createElement('div');
  wrap.className = 'scrim';
  wrap.innerHTML = `
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="newListTitle">
      <h2 class="heading-xs" id="newListTitle">New Yacht List</h2>
      <div class="modal__field">
        <label class="modal__label text-sm-medium" for="newListName">List Name</label>
        <label class="field"><input id="newListName" type="text" placeholder="e.g. Mediterranean Charter Prospects" autocomplete="off"></label>
        <span class="modal__helper text-xs-regular">You can add yachts to the list from any Yachts Card.</span>
      </div>
      <div class="modal__actions">
        <button class="btn-outline" type="button" data-modal-cancel>Cancel</button>
        <button class="btn-solid" type="button" data-modal-create disabled>+ Create List</button>
      </div>
    </div>`;
  document.body.appendChild(wrap);
  const input = wrap.querySelector('#newListName'), create = wrap.querySelector('[data-modal-create]');
  const close = () => { wrap.remove(); el('idxListInput')?.focus(); };
  input.addEventListener('input', () => { create.disabled = !input.value.trim(); });
  wrap.addEventListener('click', ev => {
    if (ev.target === wrap || ev.target.closest('[data-modal-cancel]')) close();
    if (ev.target.closest('[data-modal-create]') && input.value.trim()){
      SAVED_LISTS.unshift(input.value.trim()); wrap.remove();
      state.idx.listOpen = true; render(); el('idxListInput').focus();
    }
  });
  wrap.addEventListener('keydown', ev => {
    if (ev.key === 'Escape') close();
    if (ev.key === 'Enter' && !create.disabled) create.click();
  });
  input.focus();
}

/* Delete a list — same destructive confirmation as a show */
function confirmDeleteList(){
  const name = YACHT_LIST.name;
  const wrap = document.createElement('div');
  wrap.className = 'scrim';
  wrap.innerHTML = `
    <div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="dlTitle">
      <h2 class="heading-xs" id="dlTitle">Delete List</h2>
      <p class="text-sm-regular" style="margin:0;color:var(--color-text-default-tertiary)">
        ${esc(name)} will be removed for everyone it was shared with. The yachts themselves stay in All Yachts.</p>
      <div class="modal__actions">
        <button class="btn-outline" type="button" data-dl-cancel>Cancel</button>
        <button class="btn-destructive" type="button" data-dl-ok>Delete List</button>
      </div>
    </div>`;
  document.body.appendChild(wrap);
  wrap.addEventListener('click', ev => {
    if (ev.target === wrap || ev.target.closest('[data-dl-cancel]')) return wrap.remove();
    if (ev.target.closest('[data-dl-ok]')){
      const i = SAVED_LISTS.indexOf(name); if (i > -1) SAVED_LISTS.splice(i, 1);
      wrap.remove(); state.screen = 'all-yachts'; render(); toast(`${name} deleted`);
    }
  });
  wrap.addEventListener('keydown', ev => { if (ev.key === 'Escape') wrap.remove(); });
  wrap.querySelector('[data-dl-cancel]').focus();
}

/* Delete a show — Modal with the Destructive Outline button */
function confirmDeleteShow(name){
  const opener = document.activeElement;
  const wrap = document.createElement('div');
  wrap.className = 'scrim';
  wrap.innerHTML = `
    <div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="delTitle" aria-describedby="delBody">
      <h2 class="heading-xs" id="delTitle">Delete Show</h2>
      <p class="text-sm-regular" id="delBody" style="margin:0;color:var(--color-text-default-tertiary)">
        ${esc(name)} and its roster, berths and notes will be removed for everyone in your brokerage. This can’t be undone.</p>
      <div class="modal__actions">
        <button class="btn-outline" type="button" data-del-cancel>Cancel</button>
        <button class="btn-destructive" type="button" data-del-confirm>Delete Show</button>
      </div>
    </div>`;
  document.body.appendChild(wrap);
  const close = () => { wrap.remove(); opener?.focus?.(); };
  wrap.addEventListener('click', ev => {
    if (ev.target === wrap || ev.target.closest('[data-del-cancel]')) return close();
    if (ev.target.closest('[data-del-confirm]')){
      const i = SHOWS.findIndex(sh => sh.name === name);
      if (i > -1) SHOWS.splice(i, 1);
      wrap.remove(); render(); toast(`${name} deleted`);
    }
  });
  wrap.addEventListener('keydown', ev => { if (ev.key === 'Escape') close(); });
  wrap.querySelector('[data-del-cancel]').focus();
}

  const pos = e.target.selectionStart; render();

});
document.addEventListener('keydown', e => {

/* Sort menu keyboard — Escape closes, arrows move between items */
document.addEventListener('keydown', e => {
  if (!state.idx.sortOpen) return;
  if (e.key === 'Escape'){ state.idx.sortOpen = false; render(); el('idxSortBtn')?.focus(); return; }
  if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
  const items = [...document.querySelectorAll('#idxSortMenu .menu-item')];
  const i = items.indexOf(document.activeElement);
  e.preventDefault();
  items[(i + (e.key === 'ArrowDown' ? 1 : items.length - 1) + items.length) % items.length].focus();
});

/* Roving arrow-key movement on every tablist — Tab has no Focus state in
   Figma (DS open item 21), so the ring and the keyboard model live here. */
document.addEventListener('keydown', e => {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  const strip = e.target.closest('[role="tablist"]');
  if (!strip) return;
  const tabs = [...strip.querySelectorAll('[role="tab"], .tab')];
  const i = tabs.indexOf(e.target);
  if (i === -1) return;
  e.preventDefault();
  tabs[(i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length].focus();
});

/* Menu defaults per breakpoint: expanded above 1024, collapsed 640–1024 */
const mq = window.matchMedia('(max-width: 1024px)');
function applyBreakpointDefault(m){
  el('app').dataset.menu = m.matches ? 'collapsed' : 'expanded';
  syncToggle();
}
mq.addEventListener('change', applyBreakpointDefault);

renderChrome();
applyBreakpointDefault(mq);
render();
</script>

</body></html>
